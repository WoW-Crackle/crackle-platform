<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        background-color: #f9fafb;
        color: #111827;
      }

      .page-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background-color: #ffffff;
        border-radius: 24px;
        padding: 32px 32px 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        border: 1px solid #f3f4f6;
      }

      .card-title {
        font-size: 22px;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
      }

      .card-subtext {
        text-align: center;
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #4b5563;
        margin-bottom: 4px;
      }

      .form-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        font-size: 14px;
        background-color: #f3f4f6;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease,
          background-color 0.15s ease;
      }

      .form-input::placeholder {
        color: #9ca3af;
      }

      .form-input:focus {
        border-color: #6366f1;
        background-color: #ffffff;
        box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.4);
      }

      .submit-btn {
        margin-top: 18px;
        width: 100%;
        padding: 11px 16px;
        border-radius: 999px;
        border: none;
        background-color: #6366f1;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, box-shadow 0.15s ease,
          transform 0.05s ease;
      }

      .submit-btn:hover {
        background-color: #4f46e5;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.25);
      }

      .submit-btn:active {
        transform: translateY(1px);
        box-shadow: none;
      }

      .link-row {
        margin-top: 12px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #6b7280;
      }

      .link-row a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
      }

      .link-row a:hover {
        text-decoration: underline;
      }

      .bottom-text {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: #6b7280;
      }

      .bottom-text a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
        margin-left: 4px;
      }

      .bottom-text a:hover {
        text-decoration: underline;
      }

      .error-box {
        margin-bottom: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        background-color: #fef2f2;
        color: #b91c1c;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <div class="card">
        <div class="card-title">로그인</div>
        <div class="card-subtext">
          계속하려면 이메일과 비밀번호를 입력해주세요.
        </div>

        <div id="error-box" class="error-box" style="display: none"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">이메일</label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-input"
              placeholder="이메일 주소"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">비밀번호</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-input"
              placeholder="비밀번호"
              required
            />
          </div>

          <button type="submit" class="submit-btn">로그인</button>

          <div class="link-row">
            <span></span>
            <a href="#">비밀번호를 잊으셨나요?</a>
          </div>
        </form>

        <div class="bottom-text">
          계정이 없으신가요?
          <a href="/signup">가입하기</a>
        </div>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("login-form");
      const errorBox = document.getElementById("error-box");

      // 이미 로그인된 상태면 홈으로 이동(선택)
      if (localStorage.getItem("access_token")) {
        window.location.href = "/";
      }

      function showError(message) {
        errorBox.innerHTML = message;
        errorBox.style.display = "block";
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";
        errorBox.innerHTML = "";

        const payload = {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        };

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok) {
            // ✅ 로그인 성공: 토큰 저장 (홈 화면 버튼 토글이 이 값으로 동작함)
            localStorage.setItem("access_token", data.access_token);
            localStorage.setItem("refresh_token", data.refresh_token);

            // (선택) 토큰 타입도 필요하면 저장
            // localStorage.setItem("token_type", data.token_type || "Bearer");

            window.location.href = "/";
            return;
          }

          // 에러 응답 처리(명세: invalid_credentials는 message로 옴)
          if (data.message) {
            showError(data.message);
            return;
          }

          // 유효성 에러(명세: errors 객체)
          if (data.errors) {
            const messages = [];
            for (const [field, msgs] of Object.entries(data.errors)) {
              (msgs || []).forEach((m) => messages.push(`${field}: ${m}`));
            }
            showError(messages.join("<br />") || "로그인에 실패했습니다.");
            return;
          }

          showError("로그인에 실패했습니다.");
        } catch (err) {
          console.error(err);
          alert("서버와 통신 중 오류가 발생했습니다.");
        }
      });
    </script>
  </body>
</html>
