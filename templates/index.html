<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Crackle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background-color:#f5f5ff;color:#111827;line-height:1.5}
    a{text-decoration:none;color:inherit}
    
    .navbar{width:100%;background:#ffffff;border-bottom: 1px solid #e5e7eb;}
    .navbar-inner{position:relative;max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}    
    .nav-left{font-weight:600;font-size:18px}
    .nav-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:32px;font-size:15px;}
    .nav-center a{color:#6b7280}
    .nav-center a.active{color:#4f46e5;font-weight:600}
    .nav-center a:hover{color:#4f46e5}

    .nav-right{display:flex;gap:10px;font-size:14px;align-items:center}
    .nav-button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;transition:.15s}
    .nav-button:hover{background:#f9fafb}
    .nav-button.primary{border:none;background:#6366f1;color:#fff;font-weight:600}
    .nav-button.primary:hover{background:#4f46e5}
    .nav-button span.icon{font-size:16px}

    .hidden{display:none!important}

    .hero{width:100%;min-height:calc(100vh - 64px);padding:80px 20px;background:#eef0ff;display:flex; align-items:center;}
    .hero-inner{max-width:1100px;margin:0 auto;background:#eef0ff;border-radius:24px;padding:60px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
    .hero-left-title{font-size:32px;font-weight:700;line-height:1.25;margin-bottom:16px}
    .hero-left-title span{display:block}
    .hero-left-title span:first-child{font-size:36px}
    .hero-left-title span:last-child{font-size:28px;font-weight:600;color:#1f2937}
    .hero-desc{font-size:14px;line-height:1.7;color:#4b5563;margin-bottom:28px;max-width:420px}
    .hero-buttons{display:flex;gap:12px;flex-wrap:wrap}

    .btn-primary{padding:10px 20px;border-radius:999px;border:none;background:#6366f1;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
    .btn-primary:hover{background:#4f46e5}
    .btn-secondary{padding:10px 20px;border-radius:999px;border:1px solid #d1d5db;background:#fff;color:#374151;font-size:14px;font-weight:500;cursor:pointer;transition:.15s}
    .btn-secondary:hover{background:#f9fafb}

    .hero-image-wrapper{display:flex;justify-content:center}
    .hero-image-card{width:100%;max-width:360px;aspect-ratio:16/10;border-radius:24px;background:#fff;box-shadow:0 15px 45px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}    .hero-image-placeholder{width:120px;height:120px;border-radius:999px;border:10px solid #fde68a;background:radial-gradient(circle at 30% 30%,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center}
    .hero-image-placeholder span{font-size:40px;color:#fef2f2}

    @media(max-width:900px){
    .hero-inner{grid-template-columns:1fr}
    .hero-image-wrapper{order:-1}
    .nav-center{display:none}
    }
    </style>
  </head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="nav-left"><a href="/">Crackle</a></div>

        <div class="nav-center">
          <a href="#" class="active">홈</a>
          <a href="#">문제</a>
          <a href="#">랭킹</a>
        </div>

        <div class="nav-right">
          <a class="nav-button" id="mySubmissionsLink" href="/login">
            <span class="icon">📝</span>
            <span>내 제출</span>
          </a>
          <a class="nav-button" id="dashboardLink" href="/login">
            <span class="icon">🏠</span>
            <span>대시보드</span>
          </a>

          <!-- 비로그인: 로그인 버튼 노출 -->
          <a id="loginBtn" class="nav-button primary" href="/login">로그인</a>

          <!-- 로그인: 로그아웃 버튼 노출 -->
          <button id="logoutBtn" class="nav-button" type="button">로그아웃</button>
        </div>
      </div>
    </nav>

    <!-- 히어로 섹션 -->
    <main class="hero">
      <div class="hero-inner">
        <section>
          <div class="hero-left-title">
            <span>Crackle</span>
            <span>Secure Coding Playground</span>
          </div>

          <p class="hero-desc">
            시뮬레이션된 공격과 취약점 수정을 통해 실제 사이버 보안 기술을 연마하세요.
          </p>

          <div class="hero-buttons">
            <!-- 비로그인: 로그인/회원가입 버튼 노출 -->
            <a href="/login" class="btn-primary" id="heroLoginBtn">로그인 / 회원가입</a>

            <!-- 비로그인: 게스트 버튼 노출 -->
            <button class="btn-secondary" id="guestBtn" type="button">게스트로 시작</button>
          </div>
        </section>

        <section class="hero-image-wrapper">
          <div class="hero-image-card">
            <div class="hero-image-placeholder"><span>🔒</span></div>
          </div>
        </section>
      </div>
    </main>

    <script>
      // 로그인 상태 판별 
      function isLoggedIn() {
        return Boolean(localStorage.getItem("access_token"));
      }

      // UI 동기화 함수 
      function syncUI() {
        const loggedIn = isLoggedIn();
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const heroLoginBtn = document.getElementById("heroLoginBtn");
        const guestBtn = document.getElementById("guestBtn");
        const mySubmissionsLink = document.getElementById("mySubmissionsLink");
        const dashboardLink = document.getElementById("dashboardLink");

        loginBtn.classList.toggle("hidden", loggedIn);
        logoutBtn.classList.toggle("hidden", !loggedIn);
        heroLoginBtn.classList.toggle("hidden", loggedIn);
        guestBtn.classList.toggle("hidden", loggedIn);

        if (loggedIn) {
          mySubmissionsLink.setAttribute("href", "#");
          dashboardLink.setAttribute("href", "#");
        } else {
          mySubmissionsLink.setAttribute("href", "/login");
          dashboardLink.setAttribute("href", "/login");
        }
      }

      // 로그인 상태에서 # 클릭 시 스크롤 이동 방지
      document.addEventListener("click", (e) => {
        if (!isLoggedIn()) return;
        const a = e.target.closest("a");
        if (!a) return;

        if (a.id === "mySubmissionsLink" || a.id === "dashboardLink") {
          e.preventDefault();
        }
      });

      // 페이지 로드 시 UI 1회 동기화
      document.addEventListener("DOMContentLoaded", syncUI);

      // 로그아웃 처리 
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        const accessToken = localStorage.getItem("access_token");
        const refreshToken = localStorage.getItem("refresh_token");

        try {
          if (accessToken && refreshToken) {
            await fetch("/auth/logout", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ refresh_token: refreshToken, all_devices: false }),
            });
          }
        } finally {
          // 클라이언트 토큰 제거
          localStorage.removeItem("access_token");
          localStorage.removeItem("refresh_token");

          // 로그인 전 홈 화면으로 이동
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
