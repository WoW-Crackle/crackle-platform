<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Crackle{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <div class="nav-left"><a href="/">Crackle</a></div>
    <div class="nav-right">
      <a href="/" class="{% if page=='home' %}active{% endif %}">홈</a>
      <a href="{{ url_for('challenge_list_page') }}" class="{% if page=='challenges' %}active{% endif %}">문제</a>
      <a href="{{ url_for('login_page') }}" class="nav-button primary">로그인</a>
    </div>
  </div>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
