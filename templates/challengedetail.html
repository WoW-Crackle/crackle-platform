{% extends "base.html" %}
{% block content %}

<div class="challenge-detail" data-id="{{ challenge.id }}">
    <h1>{{ challenge.title }}</h1>
    <p>{{ challenge.description }}</p>
    <p>난이도: {{ challenge.difficulty }}</p>
    <p>태그:</p>
    <ul>
        {% for tag in challenge.tags %}
            <li>{{ tag }}</li>
        {% endfor %}
    </ul>
</div>

{% endblock %}
