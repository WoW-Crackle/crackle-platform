{% extends "base.html" %}
{% block title %}Crackle - Secure Coding Playground{% endblock %}
{% set page = "home" %}

{% block content %}
<main class="hero">
  <div class="hero-inner">
    <h1 class="hero-title">Crackle</h1>
    <div class="hero-image">🔐</div>
    <p class="hero-subtitle">Secure Coding Playground</p>
    <p class="hero-desc">
      시뮬레이션된 공격과 취약점 수정을 통해<br>

    <div class="hero-buttons">
      <a href="{{ url_for('login_page') }}" class="btn-login">로그인 / 회원가입</a>
      <a href="{{ url_for('challenge_list_page') }}" class="btn-guest">게스트로 시작</a>

  </div>
</main>
{% endblock %}
