{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block content %}
<div class="login-container">
  <h1>로그인</h1>
  <form method="post" action="/login">
    <div>
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" required>
    </div>
    <div>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">로그인</button>
  </form>
</div>

<style>
.login-container { max-width:400px; margin:50px auto; padding:20px; border:1px solid #ddd; border-radius:8px; }
.login-container h1 { text-align:center; margin-bottom:20px; }
.login-container form div { margin-bottom:15px; }
.login-container form label { display:block; font-weight:bold; margin-bottom:5px; }
.login-container form input { width:100%; padding:8px; box-sizing:border-box; }
.login-container form button { width:100%; padding:10px; background:#6366f1; color:#fff; border:none; border-radius:4px; cursor:pointer; }
.login-container form button:hover { background:#4f46e5; }
</style>
{% endblock %}
