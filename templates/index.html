{% extends "base.html" %}
{% block title %}Crackle - Secure Coding Playground{% endblock %}
{% set page = "home" %}

{% block head %}
<style>
body {
    background:#EEF0FF;
    min-height:100vh;
}

.hero {
    width: 100%;
    padding: 80px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.hero-inner {
    max-width: 1100px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
}

.hero-inner > div {
    text-align:left;
}

.hero-title {
    font-size: 44px;
    font-weight: 800;
    margin-bottom: 12px;
}

.hero-subtitle {
    font-size: 18px;
    font-weight: 600;
    color: #4b5563;
    margin-bottom: 18px;
}

.hero-desc {
    font-size: 15px;
    color: #6b7280;
    margin-bottom: 32px;
    max-width: 420px;
}

.hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
}

.btn-login,
.btn-guest {
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
}

.btn-login {
    background: #6366f1;
    border: none;
    color: white;
}
.btn-login:hover {
    background: #4f46e5;
}

.btn-guest {
    background: white;
    color: #374151;
    border: 1px solid #d1d5db;
}
.btn-guest:hover {
    background: #f9fafb;
}

.hero-image {
    flex:1;
    max-width: 420px;
    aspect-ratio: 1.4;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    box-shadow: 0 18px 50px rgba(0,0,0,.08);
}

.hero-image span {
    font-size: 65px;
}

.hidden { display: none !important; }

@media(max-width:900px){
    .hero-inner {
        flex-direction:column;
        text-align:center;
    }
    .hero-inner > div {
        text-align:center;
    }
    .hero-image {
        order:-1;
        width:80%;
        margin:0 auto;
    }
    .hero-buttons {
        justify-content:center;
    }
}
</style>
{% endblock %}

{% block content %}
<main class="hero">
  <div class="hero-inner">

    <div>
      <h1 class="hero-title">Crackle</h1>
      <p class="hero-subtitle">Secure Coding Playground</p>

      <p class="hero-desc">
        시뮬레이션된 공격과 취약점 수정을 통해<br>실제 사이버 보안 기술을 연마하세요.
      </p>

      <div class="hero-buttons">
        <a href="/login" class="btn-login">로그인 / 회원가입</a>
        <button class="btn-guest" id="guestBtn">게스트로 시작</button>
      </div>
    </div>

    <div class="hero-image">
      <span>🔐</span>
    </div>
  </div>
</main>
{% endblock %}
