<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Crackle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <style>
      /* 기본 설정 */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background-color: #f5f5ff;
        color: #111827;
      }
      a { text-decoration: none; color: inherit; }

      /* 상단 네비게이션 바 */
      .navbar {
        position: sticky; top: 0; z-index: 10; width: 100%;
        background-color: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }
      .navbar-inner {
        max-width: 1100px; margin: 0 auto; padding: 12px 20px;
        display: flex; align-items: center; justify-content: space-between;
      }
      .nav-left { font-weight: 600; font-size: 18px; }
      .nav-center { display: flex; gap: 32px; font-size: 15px; }
      .nav-center a { color: #6b7280; }
      .nav-center a.active { color: #4f46e5; font-weight: 600; }

      .nav-right { display: flex; gap: 10px; font-size: 14px; align-items: center; }
      .nav-button {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 12px; border-radius: 999px;
        border: 1px solid #e5e7eb; background-color: #ffffff;
        color: #374151; cursor: pointer;
      }
      .nav-button.primary { border: none; background-color: #6366f1; color: #ffffff; font-weight: 600; }
      .nav-button span.icon { font-size: 16px; }

      /* 숨김 처리 클래스 */
      .hidden { display: none !important; }

      /* 히어로 섹션 */
      .hero { width: 100%; padding: 60px 16px 80px; }
      .hero-inner {
        max-width: 1100px; margin: 0 auto;
        background-color: #eef0ff; border-radius: 24px;
        padding: 60px 60px;
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
        gap: 40px; align-items: center;
      }
      .hero-left-title { font-size: 32px; font-weight: 700; line-height: 1.25; margin-bottom: 16px; }
      .hero-left-title span { display: block; }
      .hero-desc { font-size: 14px; line-height: 1.7; color: #4b5563; margin-bottom: 28px; }
      .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
      .btn-primary {
        padding: 10px 20px; border-radius: 999px; border: none;
        background-color: #6366f1; color: #ffffff; font-size: 14px; font-weight: 600;
        cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      }
      .btn-secondary {
        padding: 10px 20px; border-radius: 999px; border: 1px solid #d1d5db;
        background-color: #ffffff; color: #374151; font-size: 14px; font-weight: 500; cursor: pointer;
      }

      /* 히어로 이미지 카드 */
      .hero-image-wrapper { display: flex; justify-content: center; }
      .hero-image-card {
        width: 100%; max-width: 360px; aspect-ratio: 16 / 10;
        border-radius: 24px; background: #ffffff;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        display: flex; align-items: center; justify-content: center;
      }
      .hero-image-placeholder {
        width: 120px; height: 120px; border-radius: 999px; border: 8px solid #fee2e2;
        background: radial-gradient(circle at 30% 30%, #f97316, #ef4444);
        display: flex; align-items: center; justify-content: center;
      }
      .hero-image-placeholder span { font-size: 40px; color: #fef2f2; }

      /* 반응형 디자인 */
      @media (max-width: 900px) {
        .hero-inner { grid-template-columns: 1fr; padding: 40px 24px; }
        .hero-image-wrapper { order: -1; }
        .nav-center { display: none; }
      }
    </style>
  </head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="nav-left"><a href="/">Crackle</a></div>

        <div class="nav-center">
          <a href="#" class="active">홈</a>
          <a href="#">문제</a>
          <a href="#">랭킹</a>
        </div>

        <div class="nav-right">
          <a class="nav-button" id="mySubmissionsLink" href="/login">
            <span class="icon">📝</span>
            <span>내 제출</span>
          </a>
          <a class="nav-button" id="dashboardLink" href="/login">
            <span class="icon">🏠</span>
            <span>대시보드</span>
          </a>

          <!-- 비로그인: 로그인 버튼 노출 -->
          <a id="loginBtn" class="nav-button primary" href="/login">로그인</a>

          <!-- 로그인: 로그아웃 버튼 노출 -->
          <button id="logoutBtn" class="nav-button" type="button">로그아웃</button>
        </div>
      </div>
    </nav>

    <!-- 히어로 섹션 -->
    <main class="hero">
      <div class="hero-inner">
        <section>
          <div class="hero-left-title">
            <span>Crackle</span>
            <span>Secure Coding Playground</span>
          </div>

          <p class="hero-desc">
            시뮬레이션된 공격과 취약점 수정을 통해 실제 사이버 보안 기술을 연마하세요.
          </p>

          <div class="hero-buttons">
            <!-- 비로그인: 로그인/회원가입 버튼 노출 -->
            <a href="/login" class="btn-primary" id="heroLoginBtn">로그인 / 회원가입</a>

            <!-- 비로그인: 게스트 버튼 노출 -->
            <button class="btn-secondary" id="guestBtn" type="button">게스트로 시작</button>
          </div>
        </section>

        <section class="hero-image-wrapper">
          <div class="hero-image-card">
            <div class="hero-image-placeholder"><span>🔒</span></div>
          </div>
        </section>
      </div>
    </main>

    <script>
      // 로그인 상태 판별 
      function isLoggedIn() {
        return Boolean(localStorage.getItem("access_token"));
      }

      // UI 동기화 함수 
      function syncUI() {
        const loggedIn = isLoggedIn();
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const heroLoginBtn = document.getElementById("heroLoginBtn");
        const guestBtn = document.getElementById("guestBtn");
        const mySubmissionsLink = document.getElementById("mySubmissionsLink");
        const dashboardLink = document.getElementById("dashboardLink");

        loginBtn.classList.toggle("hidden", loggedIn);
        logoutBtn.classList.toggle("hidden", !loggedIn);
        heroLoginBtn.classList.toggle("hidden", loggedIn);
        guestBtn.classList.toggle("hidden", loggedIn);

        if (loggedIn) {
          mySubmissionsLink.setAttribute("href", "#");
          dashboardLink.setAttribute("href", "#");
        } else {
          mySubmissionsLink.setAttribute("href", "/login");
          dashboardLink.setAttribute("href", "/login");
        }
      }

      // 로그인 상태에서 # 클릭 시 스크롤 이동 방지
      document.addEventListener("click", (e) => {
        if (!isLoggedIn()) return;
        const a = e.target.closest("a");
        if (!a) return;

        if (a.id === "mySubmissionsLink" || a.id === "dashboardLink") {
          e.preventDefault();
        }
      });

      // 페이지 로드 시 UI 1회 동기화
      document.addEventListener("DOMContentLoaded", syncUI);

      // 로그아웃 처리 
      document.getElementById("logoutBtn").addEventListener("click", async () => {
        const accessToken = localStorage.getItem("access_token");
        const refreshToken = localStorage.getItem("refresh_token");

        try {
          if (accessToken && refreshToken) {
            await fetch("/auth/logout", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${accessToken}`,
              },
              body: JSON.stringify({ refresh_token: refreshToken, all_devices: false }),
            });
          }
        } finally {
          // 클라이언트 토큰 제거
          localStorage.removeItem("access_token");
          localStorage.removeItem("refresh_token");

          // 로그인 전 홈 화면으로 이동
          window.location.href = "/";
        }
      });
    </script>
  </body>
</html>
